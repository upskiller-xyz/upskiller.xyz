name: Release image

# Build + push the service image to the Scaleway registry via the shared
# composite action in infra.lux (which runs infra.lux/scripts/release.sh).
# Tag scheme: v1.2.0 -> 1.2.0 + latest | master -> git-describe + edge |
#             dispatch -> branch-sha (+ optional postfix). See infra.lux/README.md.

on:
  push:
    tags: ["v*"]
    branches: [master]
  workflow_dispatch:
    inputs:
      postfix:
        description: "Extra immutable tag for this manual build (e.g. rc.1)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Serialize PUSH builds that move a shared tag (latest on tag pushes, edge on
  # master) so two releases can't race and leave latest/edge on the wrong image.
  # workflow_dispatch (even on master) and feature builds only produce immutable
  # branch-sha tags → key per-ref and cancel superseded runs.
  group: release-${{ (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master')) && 'shared' || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master')) }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # release.sh needs full history + tags for `git describe`
      - uses: upskiller-xyz/infra.lux/.github/actions/release@master
        with:
          image: upskiller-web
          namespace: web-nsp
          postfix: ${{ github.event.inputs.postfix || '' }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}

  deploy:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Install Scaleway CLI
        run: |
          curl -sL "https://github.com/scaleway/scaleway-cli/releases/latest/download/scaleway-cli_linux_amd64" -o scw
          chmod +x scw && sudo mv scw /usr/local/bin/

      - name: Deploy to Scaleway Serverless Container
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_DEFAULT_REGION: fr-par
        run: |
          semver="${GITHUB_REF_NAME#v}"
          image="rg.fr-par.scw.cloud/web-nsp/upskiller-web:${semver}"

          namespace_id=$(scw container namespace list name=upskiller-nsp -o json | jq -r '.[0].id')
          container_id=$(scw container container list name=upskiller-web-container namespace-id="$namespace_id" -o json | jq -r '.[0].id')

          scw container container update "$container_id" registry-image="$image"
          scw container container deploy "$container_id" --wait
